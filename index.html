:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

html{height:100%}

.sw{position:relative;display:flex;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:4px;cursor:pointer;backdrop-filter:blur(8px);font:inherit;color:var(--tx)}
.sw span{position:relative;z-index:1;padding:6px 12px;font-size:.85rem;font-weight:600;transition:.3s;opacity:.6}
.sw i{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:99px;background:linear-gradient(135deg,var(--ac),var(--ac2));transition:.4s cubic-bezier(.7,0,.2,1);inset-inline-start:4px}
[data-theme=pink] .sw i{inset-inline-start:calc(50%)}
[data-theme=nature] .sw span:first-of-type,[data-theme=pink] .sw span:last-of-type{opacity:1;color:#06110a}
[data-theme=pink] .sw span:last-of-type{color:#fff}
.card{margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;backdrop-filter:blur(14px);box-shadow:0 20px 60px -30px var(--ac);animation:up .5s}

.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:.4s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.1rem;font-weight:600;margin:18px 0 10px;direction:ltr;text-align:left;line-height:1.5}
pre{direction:ltr;text-align:left;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;overflow-x:auto;font-size:.82rem;margin:8px 0;color:var(--ac2);max-width:100%}

  balance = balance + amount

setTheme(st==="pink"?"pink":"nature");
function home(){app.innerHTML=`<div class="card hero"><div class="em">🎯</div><h2>جاهز للاختبار؟</h2><p>${DATA.length} سؤال بترتيب عشوائي · الأسئلة والخيارات تتبدل كل مرة<br>الإجابات الصح والغلط تظهر بالنهاية</p><button class="btn" id="go">ابدأ الاختبار</button></div>`;$("#go").addEventListener("click",start)}
function start(){qs=shuf(DATA).map(q=>({...q,opts:shuf(q.o.map((t,k)=>({t,c:k==q.a})))}));ans=Array(qs.length).fill(-1);i=0;show()}
function show(){const q=qs[i],L="ABCD";
app.innerHTML=`<div class="card"><div class="meta"><span>سؤال ${i+1} من ${qs.length}</span><span>تم الجواب: ${ans.filter(x=>x>=0).length}</span></div><div class="bar"><b style="width:${(i+1)/qs.length*100}%"></b></div><div class="q">${esc(q.t)}</div>${q.c?`<pre>${esc(q.c)}</pre>`:""}${q.opts.map((o,k)=>`<button class="o ${ans[i]>=0?(o.c?"ok":ans[i]==k?"x":"dis"):""}" data-k="${k}"><em>${ans[i]>=0?(o.c?"✔":ans[i]==k?"✘":L[k]):L[k]}</em><span>${esc(o.t)}</span></button>`).join("")}${ans[i]>=0?`<div class="fb ${q.opts[ans[i]].c?"yes":"nop"}">${q.opts[ans[i]].c?"✔ إجابة صحيحة":"✘ إجابة غلط، الصحيحة بالأخضر"}</div>`:""}<div class="nav"><button class="btn g" id="pv" ${i?"":"disabled"}>السابق</button><button class="btn" id="nx" ${ans[i]<0?"disabled":""}>${i==qs.length-1?"إنهاء":"التالي"}</button></div><button type="button" class="btn g rs" id="rs">🔄 إعادة من الأول</button></div>`;
app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(ans[i]>=0)return;ans[i]=+b.dataset.k;show()});
$("#rs").addEventListener("click",()=>{start();scrollTo(0,0)});
$("#pv").onclick=()=>{i--;show()};$("#nx").onclick=()=>{i==qs.length-1?end():(i++,show())}}
function end(){const ok=qs.filter((q,k)=>q.opts[ans[k]]?.c).length,n=qs.length,p=Math.round(ok/n*100);
app.innerHTML=`<div class="card score"><h2>${p>=80?"🔥 ممتاز!":p>=50?"👏 زين":"💪 حاول مرة ثانية"}</h2><div class="ring" style="--p:${p}%"><span>${p}%</span></div><div class="stats"><span class="yes">✔ صح: ${ok}</span><span class="nop">✘ غلط: ${n-ok}</span></div><div class="tabs"><button data-f="all">الكل</button><button data-f="bad">الغلط</button><button data-f="good">الصح</button></div><button class="btn" id="re">اختبار جديد 🔀</button></div><div id="rev"></div>`;
$("#re").onclick=start;
const tabs=app.querySelectorAll(".tabs button");
const draw=()=>{tabs.forEach(t=>t.classList.toggle("on",t.dataset.f==filter));
$("#rev").innerHTML=qs.map((q,k)=>{const g=q.opts[ans[k]]?.c;if(filter=="bad"&&g||filter=="good"&&!g)return"";const c=q.opts.find(o=>o.c).t;
return`<div class="r ${g?"":"bad"}"><small>#${k+1} · ${g?"✔ إجابتك صحيحة":ans[k]<0?"✘ بدون إجابة":"✘ إجابتك غلط"}</small> <b>${esc(q.t)}</b>${q.c?`<pre>${esc(q.c)}</pre>`:""}${q.opts.map((o,m)=>{const mine=ans[k]===m;return`<div class="ro ${o.c?"ok":mine?"x":""}"><em>${o.c?"✔":mine?"✘":"ABCD"[m]}</em><span>${esc(o.t)}</span>${o.c?`<b class="tag">${mine?"جوابك · صحيح":"الجواب الصحيح"}</b>`:mine?`<b class="tag">جوابك · غلط</b>`:""}</div>`}).join("")}</div>`}).join("")};
tabs.forEach(t=>t.onclick=()=>{filter=t.dataset.f;draw()});draw();scrollTo({top:0,behavior:"smooth"})}
home();
addEventListener("pageshow",e=>{if(e.persisted)home()});
</script>
</body>
</html>
