<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS MCQ Quiz</title>
<style>
:root{--bg:#000;--card:#111;--text:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a;--accent:#fff;--accent-text:#000;--ok:#2ecc71;--bad:#ff5c5c;--okbg:rgba(46,204,113,.14);--badbg:rgba(255,92,92,.14);--hover:#1c1c1c}
[data-theme="pink"]{--bg:#fff0f6;--card:#fff;--text:#4a1d35;--muted:#a0607f;--line:#f7c6dc;--accent:#e0457f;--accent-text:#fff;--ok:#1f9d63;--bad:#d6336c;--okbg:rgba(31,157,99,.12);--badbg:rgba(214,51,108,.12);--hover:#ffe3ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;transition:background .3s,color .3s;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:1.3rem;margin:0}
.sub{color:var(--muted);font-size:.85rem}
button{font:inherit;cursor:pointer}
.theme{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;white-space:nowrap}
.theme:hover{background:var(--hover)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:background .3s}
.sec{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.15rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.opt:hover:not(:disabled){background:var(--hover);border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:focus-visible,.theme:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:12px;padding:11px 22px;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:22px}
.res{text-align:center}
.score{font-size:3rem;font-weight:700;margin:6px 0}
.rev{text-align:left;margin-top:18px;max-height:340px;overflow:auto}
.rev div{padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.rev b.ok{color:var(--ok)}.rev b.bad{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>CSS MCQ Quiz</h1><div class="sub">Web Applications Programming · by @t5qtt</div></div>
 <button class="theme" id="theme" type="button">🌸 Pink theme</button>
</header>
<div class="bar"><i id="fill"></i></div>
<div class="meta"><span id="count"></span><span id="score"></span></div>
<div class="card" id="box"></div>
<footer>by @t5qtt</footer>
</div>
<script>
const S=["Introduction, History & Importance","How CSS Works, Syntax & Adding CSS","Selectors, Colors & Typography","The CSS Box Model","Layouts, Position & Responsive Design","HTML vs CSS"];
// [section, question, options[], correctIndex]
const Q=[
[0,"What does the acronym CSS stand for?",["Computer Style Sheets","Cascading Style Sheets","Creative Styling System","Colorful Sheet Syntax"],1],
[0,"What is the primary role of CSS when working alongside HTML?",["Defining the basic structure and text content of a webpage","Managing server-side databases and network security","Controlling the visual presentation, colors, fonts, spacing, and layout of web pages","Compiling browser scripts into binary code"],2],
[0,"How does a web browser render a styled webpage?",["It ignores HTML once a CSS file is detected","It combines HTML and CSS together to render the final webpage","It uses CSS to write text content and HTML to color it","It displays CSS code directly as plain text to the user"],1],
[0,"In which year was CSS1 released as the first W3C CSS Recommendation?",["1994","1996","1998","2011"],1],
[0,"Which CSS milestone introduced expanded styling and positioning features in 1998?",["CSS1","CSS2","CSS2.1","CSS Modules"],1],
[0,"How is CSS maintained and developed today?",["As one single frozen version that never changes","As a collection of evolving specifications in separate modules (CSS Modules)","Exclusively inside HTML tag attributes","As a proprietary language owned by a single browser"],1],
[0,"Which advantage of CSS allows updating a shared style sheet instead of editing every webpage individually?",["Brand identity","Responsive layouts","Maintainability","Tag nesting"],2],
[0,"Keeping content in HTML and presentation rules in CSS is known as:",["Separation of concerns","Inline declaration","Universal selection","Static positioning"],0],
[1,"What is the correct sequence of steps showing how CSS works?",["Declare → Select → Render → Assign","Select → Declare → Assign → Render","Assign → Declare → Select → Render","Render → Select → Assign → Declare"],1],
[1,"In the CSS rule p { color: red; } , what is p called?",["Property","Value","Selector","Declaration"],2],
[1,"How is a declaration correctly written inside curly braces in CSS?",["value = property;","property: value;","property - value,","[property = value]"],1],
[1,"Which method adds CSS directly inside an HTML element's style attribute?",["External CSS","Internal CSS","Inline CSS","Global CSS"],2],
[1,"Where is Internal CSS written in an HTML document?",["Inside a <style> element within the document's <head>","Inside a separate .css file","Inside the href attribute of an anchor tag","Inside a <meta> tag"],0],
[1,"Which way of adding CSS is best for sharing styles across multiple web pages?",["Inline CSS","Internal CSS","External CSS","Attribute CSS"],2],
[2,"Which CSS selector targets all elements having class=\"notice\"?",["#notice",".notice","*notice","notice"],1],
[2,"What does the Universal selector ( * ) do in CSS?",["Selects only heading elements","Selects only elements with an ID","Selects all HTML elements","Selects only paragraph elements"],2],
[2,"Which CSS selector selects the specific element with id=\"main\"?",[".main","#main","*main","main"],1],
[2,"Which CSS property controls an element's transparency?",["background-image","color","opacity","font-weight"],2],
[2,"Which typography property controls the thickness of text characters?",["font-family","font-size","font-weight","text-align"],2],
[2,"Which CSS property is used to add or remove an underline from text?",["text-align","text-decoration","font-family","opacity"],1],
[3,"What is the correct order of the CSS Box Model layers from innermost to outermost?",["Margin → Border → Padding → Content","Content → Padding → Border → Margin","Content → Border → Padding → Margin","Padding → Content → Border → Margin"],1],
[3,"In the CSS Box Model, what is Padding?",["The outer space outside the border","The space between the content and the border","The text or image inside the element","The line surrounding the margin"],1],
[3,"Which Box Model property creates outer space outside an element's border?",["Padding","Content","Margin","Border"],2],
[4,"How does CSS Grid differ from Flexbox?",["CSS Grid is one-dimensional, whereas Flexbox is two-dimensional","Flexbox is a one-dimensional layout system (row or column), whereas CSS Grid is two-dimensional (rows and columns)","Flexbox works only for images, whereas CSS Grid works only for text","There is no difference between Flexbox and CSS Grid"],1],
[4,"How do two consecutive inline elements (such as <span>Hello</span> <span>Welcome</span>) appear on a webpage?",["Each element appears on a new line","Both elements appear on the same line","The second element overlaps the first","Both elements become invisible"],1],
[4,"Which CSS position value keeps an element in a fixed spot on the screen while scrolling?",["static","relative","absolute","fixed"],3],
[4,"What do Media Queries ( @media ) do in Responsive Web Design?",["Play video and audio files automatically","Apply CSS rules when specified conditions, such as viewport width, are met","Convert CSS stylesheets into HTML tags","Disable all colors on desktop screens"],1],
[5,"Which statement accurately describes the dependency and analogy between HTML and CSS?",["CSS can work independently without HTML, like the skeleton of a house","Both HTML and CSS use the .css file extension and tag-based syntax","HTML can work independently without CSS (like a house's skeleton and walls), while CSS requires HTML/XML (like paint and interior design)","HTML requires CSS in order to display plain text in a browser"],2]
];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let i=0,score=0,ans=[];

// Theme
function setTheme(t){
 document.documentElement.setAttribute("data-theme",t);
 $("theme").textContent=t==="pink"?"🌙 Black theme":"🌸 Pink theme";
 try{localStorage.setItem("theme",t)}catch(e){}
}
let saved="black";try{saved=localStorage.getItem("theme")||"black"}catch(e){}
setTheme(saved);
$("theme").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="pink"?"black":"pink");

function render(){
 const q=Q[i],a=ans[i];
 $("count").textContent="Question "+(i+1)+" of "+Q.length;
 $("score").textContent="Score: "+score;
 $("fill").style.width=((i+(a!==undefined?1:0))/Q.length*100)+"%";
 let h='<div class="sec">'+S[q[0]]+'</div><p class="q">'+esc(q[1])+'</p>';
 q[2].forEach((o,k)=>{
  let c="opt";
  if(a!==undefined){if(k===q[3])c+=" ok";else if(k===a)c+=" bad"}
  h+='<button class="'+c+'" data-k="'+k+'"'+(a!==undefined?" disabled":"")+'>'+String.fromCharCode(65+k)+') '+esc(o)+'</button>';
 });
 h+='<div class="actions"><button class="btn ghost" id="prev"'+(i===0?" disabled":"")+'>Previous</button><button class="btn" id="next"'+(a===undefined?" disabled":"")+'>'+(i===Q.length-1?"Finish":"Next")+'</button></div>';
 $("box").innerHTML=h;
 $("box").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k;ans[i]=k;if(k===q[3])score++;render();
 });
 $("prev").onclick=()=>{i--;render()};
 $("next").onclick=()=>{i<Q.length-1?(i++,render()):finish()};
}
function finish(){
 $("fill").style.width="100%";
 const p=Math.round(score/Q.length*100);
 let h='<div class="res"><div class="sub">Your result</div><div class="score">'+score+' / '+Q.length+'</div><div>'+p+'% correct</div>';
 h+='<div class="actions" style="justify-content:center"><button class="btn" id="again">Try again</button></div><div class="rev">';
 Q.forEach((q,n)=>{const ok=ans[n]===q[3];
  h+='<div><b class="'+(ok?"ok":"bad")+'">'+(ok?"Correct":"Wrong")+'</b> · Q'+(n+1)+': '+esc(q[1])+(ok?'':'<br><span class="sub">Correct answer: '+esc(q[2][q[3]])+'</span>')+'</div>';});
 h+='</div></div>';
 $("box").innerHTML=h;
 $("count").textContent="Finished";
 $("again").onclick=()=>{i=0;score=0;ans=[];render()};
}
render();
</script>
</body>
</html>
